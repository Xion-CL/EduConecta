<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConecta - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<!-- Script de debug para ver validaciones en tiempo real -->
<script type="module">
    import { Validator } from './js/utils/Validator.js';
    
    // Exponer Validator globalmente para debug en consola
    window.Validator = Validator;
    
    console.log('🔧 DEBUG MODE ACTIVO');
    console.log('Usa en consola: Validator.validateRut("11.111.111-1")');
</script>
<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-primary">EduConecta</h3>
                            <p class="text-muted">Inicia sesión con tu correo institucional</p>
                        </div>

                        <!-- Alerta de errores -->
                        <div id="alertContainer" class="alert alert-danger d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="rut" class="form-label">RUT</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="rut" 
                                       placeholder="12.345.678-9" 
                                       autocomplete="off">
                                <div class="invalid-feedback" id="rutError">Ingresa un RUT válido (ej: 11.111.111-1)</div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Institucional</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="email" 
                                       placeholder="usuario@inacapmail.cl"
                                       autocomplete="off">
                                <div class="invalid-feedback" id="emailError">El correo debe terminar en @inacap.cl o @inacapmail.cl</div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" 
                                       class="form-control" 
                                       id="password"
                                       placeholder="••••••••">
                                <div class="invalid-feedback" id="passwordError">Mínimo 8 caracteres, 1 mayúscula, 1 minúscula y 1 número</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">Ingresar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
